
spring.config.import=optional:file:.env[.properties]

spring.application.name=TripSync
server.port=${PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/tripsync_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Admin Bootstrap
app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin-bootstrap.full-name=${ADMIN_BOOTSTRAP_FULL_NAME:TripSync Admin}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Invitation
app.invitation.base-url=${APP_BASE_URL:http://localhost:3000}
app.invitation.expiration-hours=48

#document configuration

app.document.storage-dir=${DOCUMENT_STORAGE_DIR:uploads/documents}
app.document.max-size-bytes=${DOCUMENT_MAX_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#redis configuration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=${REDIS_SSL_ENABLED:false}

#redis cache configuration

spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-value=false

